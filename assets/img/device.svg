<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="Aprilous UV brush cleaner">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#f3e6e8"/><stop offset=".45" stop-color="#fffafa"/><stop offset="1" stop-color="#e7d3d8"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" x2="1">
      <stop offset="0" stop-color="#e9ddff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#d8c6ff" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="uv" cx=".5" cy=".6" r=".6">
      <stop offset="0" stop-color="#b58cff" stop-opacity=".75"/><stop offset="1" stop-color="#b58cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" x2="1">
      <stop offset="0" stop-color="#e8a9b5"/><stop offset=".5" stop-color="#f7cfd6"/><stop offset="1" stop-color="#d98d9c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#c9a27a"/><stop offset=".5" stop-color="#f4dcc0"/><stop offset="1" stop-color="#b8906a"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="452" rx="150" ry="16" fill="#3b1d2a" opacity=".08"/>
  <!-- brush -->
  <rect x="186" y="18" width="28" height="170" rx="14" fill="url(#handle)"/>
  <rect x="184" y="180" width="32" height="46" rx="6" fill="url(#gold)"/>
  <path d="M184 224 q16 70 16 88 q0 -18 16 -88 z" fill="#5a3947"/>
  <path d="M188 224 q12 50 12 76 q0 -26 12 -76 z" fill="#8a5d6f"/>
  <!-- dome -->
  <ellipse cx="200" cy="360" rx="120" ry="26" fill="url(#uv)"/>
  <path d="M86 360 C 86 250, 314 250, 314 360 Z" fill="url(#dome)" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  <path d="M110 330 C 118 290, 150 272, 176 268" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <!-- base -->
  <path d="M70 360 h260 v58 a30 30 0 0 1 -30 30 h-200 a30 30 0 0 1 -30 -30 z" fill="url(#body)"/>
  <rect x="70" y="356" width="260" height="10" rx="5" fill="#b58cff"/>
  <rect x="70" y="356" width="260" height="10" rx="5" fill="#d9c4ff" opacity=".6"/>
  <circle cx="200" cy="406" r="15" fill="none" stroke="#c98c9a" stroke-width="2"/>
  <path d="M200 398 v8" stroke="#c98c9a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a26f7d">APRILOUS</text>
</svg>
